<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test email</title>
<style>
  body{margin:0;padding:0;background:#f0f0f0;font-family:'Segoe UI',Arial,sans-serif;}
  .wrap{max-width:580px;margin:32px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.1);}
  .hdr{background:#1e2022;padding:28px 32px;text-align:center;}
  .hdr-icon{font-size:36px;}
  .hdr-title{color:#e5a00d;font-size:22px;font-weight:700;margin:8px 0 0;}
  .body{padding:32px;text-align:center;}
  .check{font-size:56px;margin-bottom:16px;}
  h2{color:#28a745;margin:0 0 12px;}
  p{color:#555;line-height:1.6;}
  .footer{background:#f9f9f9;border-top:1px solid #eee;padding:16px 32px;text-align:center;font-size:12px;color:#aaa;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-icon">🎬</div>
    <div class="hdr-title">{{ site_name }}</div>
  </div>
  <div class="body">
    <div class="check">✅</div>
    <h2>SMTP is working!</h2>
    <p>Your email configuration is set up correctly. {{ site_name }} can send emails.</p>
    <p style="font-size:13px;color:#aaa;">This is a test message sent from the Newsletter Admin panel.</p>
  </div>
  <div class="footer">{{ site_name }} · Test Email</div>
</div>
</body>
</html>
