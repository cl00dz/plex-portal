version: '3.8'

services:
  plex-portal:
    build: .
    container_name: plex-portal
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      # Change SECRET_KEY to a long random string before deploying!
      - SECRET_KEY=${SECRET_KEY:-}
      - DEBUG=False
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      # Plex & Overseerr (optional here — configurable via the setup wizard)
      - PLEX_SERVER_URL=${PLEX_SERVER_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - OVERSEERR_URL=${OVERSEERR_URL:-}
      - OVERSEERR_API_KEY=${OVERSEERR_API_KEY:-}
      # Database (leave DB_HOST empty to use the built-in SQLite)
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USERNAME=${DB_USERNAME:-plex_portal}
      - DB_PASSWORD=${DB_PASSWORD:-change_this_in_production}
      - DB_NAME=${DB_NAME:-plex_portal_db}
    volumes:
      - plex-portal-data:/app/src/data
    networks:
      - plex-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-5000}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: mysql:8.0
    container_name: plex-portal-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change_this_in_production}
      - MYSQL_DATABASE=${DB_NAME:-plex_portal_db}
      - MYSQL_USER=${DB_USERNAME:-plex_portal}
      - MYSQL_PASSWORD=${DB_PASSWORD:-change_this_in_production}
    volumes:
      - plex-portal-db:/var/lib/mysql
    networks:
      - plex-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  plex-network:
    driver: bridge

volumes:
  plex-portal-db:
  plex-portal-data:
